# Optional: spin up a local Postgres so you can run the app end-to-end
# without a cloud database. `docker compose up -d`, then set
# DATABASE_URL="postgresql://acowale:acowale@localhost:5432/acowale?schema=public"
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: acowale
      POSTGRES_PASSWORD: acowale
      POSTGRES_DB: acowale
    ports:
      - "5432:5432"
    volumes:
      - acowale_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U acowale"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  acowale_pgdata:
